pluginManagement {
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        gradlePluginPortal()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.5.0'
}

rootProject.name = 'ysm-equipment-render-patch'

if (file('../YSM-Mapping-API').exists()) {
    includeBuild('../YSM-Mapping-API')
} else {
    includeBuild("../../YSM-Mapping-API/${rootDir.name}")
}
