plugins {
    id 'java-library'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = mod_version
group = mod_group_id

base {
    archivesName = 'ysm-equipment-render-patch'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: minecraft_version
    copyIdeResources = true

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
    }
}

repositories {
    maven { url = 'https://maven.minecraftforge.net' }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    compileOnly 'net.okitsu.ysmmapping:api:0.1.0'
    compileOnly 'org.spongepowered:mixin:0.8.5'
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
        minecraft_version      : minecraft_version,
        minecraft_version_range: minecraft_version_range,
        forge_version          : forge_version,
        forge_version_range    : forge_version_range,
        loader_version_range   : loader_version_range,
        mod_id                 : mod_id,
        mod_name               : mod_name,
        mod_license            : mod_license,
        mod_version            : mod_version,
        mod_authors            : mod_authors,
        mod_description        : mod_description,
        curios_version_range   : curios_version_range,
        draconic_evolution_version_range: draconic_evolution_version_range,
        kaleidoscope_doll_version_range: kaleidoscope_doll_version_range,
        ysm_version_range      : ysm_version_range,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(Jar).configureEach {
    archiveVersion = "mc${minecraft_version}-${mod_version}"
    manifest {
        attributes['MixinConfigs'] = 'ysm_equipment_render_patch.mixins.json'
    }
}

jar.finalizedBy('reobfJar')

tasks.register('verifyDistributions') {
    dependsOn tasks.named('jar')

    doLast {
        var archive = tasks.named('jar', Jar).get().archiveFile.get().asFile
        var requiredEntries = [
            'META-INF/ysm-mapping-api/requests-v1.json',
            'ysm_equipment_render_patch.mixins.json'
        ]
        var forbiddenEntries = [
            'META-INF/services/cpw.mods.modlauncher.api.ITransformationService'
        ]

        new java.util.zip.ZipFile(archive).withCloseable { zip ->
            requiredEntries.each { entry ->
                if (zip.getEntry(entry) == null) {
                    throw new GradleException("Distribution is missing ${entry}")
                }
            }
            forbiddenEntries.each { entry ->
                if (zip.getEntry(entry) != null) {
                    throw new GradleException("Distribution still contains ${entry}")
                }
            }
            if (zip.entries().toList().any { it.name.startsWith('net/okitsu/ysmmapping/') }) {
                throw new GradleException('Distribution embeds YSM Mapping API classes')
            }
            if (zip.entries().toList().any { it.name.startsWith('net/okitsu/ysmequipmentrenderpatch/launch/') }) {
                throw new GradleException('Distribution still contains the legacy transformation service')
            }
        }

        if (tasks.named('jar', Jar).get().manifest.attributes['MixinConfigs'] != 'ysm_equipment_render_patch.mixins.json') {
            throw new GradleException('Distribution manifest does not declare the Mixin config')
        }
    }
}

tasks.named('check').configure {
    dependsOn tasks.named('verifyDistributions')
}
