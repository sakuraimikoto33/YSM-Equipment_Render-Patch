plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '1.0.17'
}

version = mod_version
group = mod_group_id

base {
    archivesName = 'ysm-equipment-render-patch'
}

def ysmMappingApiDependencyVersion = gradle.ext.ysmMappingApiDependencyVersion

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

repositories {
    maven { url = 'https://maven.neoforged.net/releases' }
}

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"
    compileOnly "net.okitsu.ysmmapping:api:${ysmMappingApiDependencyVersion}"
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
        minecraft_version      : minecraft_version,
        minecraft_version_range: minecraft_version_range,
        neo_version            : neo_version,
        neo_version_range      : neo_version_range,
        loader_version_range   : loader_version_range,
        ysm_mapping_api_version_range: ysm_mapping_api_version_range,
        mod_id                 : mod_id,
        mod_name               : mod_name,
        mod_license            : mod_license,
        mod_version            : mod_version,
        mod_authors            : mod_authors,
        mod_description        : mod_description,
        curios_version_range   : curios_version_range,
        draconic_evolution_version_range: draconic_evolution_version_range,
        kaleidoscope_doll_version_range: kaleidoscope_doll_version_range,
        ysm_version_range      : ysm_version_range,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(Jar).configureEach {
    archiveVersion = "mc${minecraft_version}-${mod_version}"
}

tasks.register('verifyDistributions') {
    dependsOn tasks.named('jar')

    doLast {
        var archive = tasks.named('jar', Jar).get().archiveFile.get().asFile
        var requiredEntries = [
            'META-INF/ysm-mapping-api/requests-v1.json',
            'ysm_equipment_render_patch.mixins.json'
        ]
        var forbiddenEntries = [
            'META-INF/services/cpw.mods.modlauncher.api.ITransformationService'
        ]

        new java.util.zip.ZipFile(archive).withCloseable { zip ->
            requiredEntries.each { entry ->
                if (zip.getEntry(entry) == null) {
                    throw new GradleException("Distribution is missing ${entry}")
                }
            }
            forbiddenEntries.each { entry ->
                if (zip.getEntry(entry) != null) {
                    throw new GradleException("Distribution still contains ${entry}")
                }
            }
            if (zip.entries().toList().any { it.name.startsWith('net/okitsu/ysmmapping/') }) {
                throw new GradleException('Distribution embeds YSM Mapping API classes')
            }
            if (zip.entries().toList().any { it.name.startsWith('net/okitsu/ysmequipmentrenderpatch/launch/') }) {
                throw new GradleException('Distribution still contains the legacy transformation service')
            }
        }
    }
}

tasks.named('check').configure {
    dependsOn tasks.named('verifyDistributions')
}
